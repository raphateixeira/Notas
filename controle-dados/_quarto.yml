# ---------------------------------------------------------------------
#  Configuração do projeto Quarto (website + apresentações revealjs).
#  Tema de pesquisa: Controle Baseado em Dados.
# ---------------------------------------------------------------------

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - DeePC/*.qmd
    - Koopman/*.qmd
    - SINDy/*.qmd
    - RL/*.qmd
    - ControleBaseadoEmDados/*.qmd

# Bibliografia compartilhada por todas as páginas do site. Cite com
# @chave no texto; veja Referencias.bib.
bibliography: Referencias.bib

website:
  title: "Controle Baseado em Dados"
  description: "Notas de pesquisa — identificação e controle a partir de dados experimentais"
  reader-mode: true
  navbar:
    background: "#1F3A5F"
    foreground: "#FFFFFF"
    title: "Controle Baseado em Dados"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Panorama"
        href: ControleBaseadoEmDados/ControleBaseadoEmDados.qmd
      - text: "Métodos"
        menu:
          - text: "DeePC"
            href: DeePC/index.qmd
          - text: "Koopman"
            href: Koopman/index.qmd
          - text: "SINDy"
            href: SINDy/index.qmd
          - text: "Aprendizagem por Reforço"
            href: RL/index.qmd
  page-footer:
    border: false
    left: "Controle Baseado em Dados"
    center: "Universidade Federal do Pará · Faculdade de Engenharia Elétrica"
    right: "Prof. Dr. Raphael Teixeira"

format:
  html:
    theme: [cosmo, TemaRTx.scss]
    toc: true
    toc-title: "Nesta página"
    page-layout: article
    lang: pt-BR

# Os decks revealjs definem o próprio `format:` no cabeçalho de cada .qmd;
# este bloco aplica-se apenas às páginas HTML (ex.: index).
