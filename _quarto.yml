# ---------------------------------------------------------------------
#  Configuração do projeto Quarto — Notas.
#  Fundamentos (links para o repositório de cada tema de estudo) e notas
#  de leitura de livros-texto (uma pasta por livro, com slides e notas complementares).
#  PDFs de livros NUNCA entram no repositório (ver .gitignore e CLAUDE.md).
# ---------------------------------------------------------------------

project:
  type: website
  output-dir: _site

execute:
  freeze: auto

bibliography: referencias.bib
csl: abnt.csl

website:
  title: "Notas"
  description: "Notas de fundamentação teórica e de leitura de livros-texto — Prof. Dr. Raphael Teixeira (UFPA-CAMTUC-FEE)"
  site-url: "https://raphateixeira.github.io/Notas/"
  reader-mode: true
  navbar:
    background: "#1F3A5F"
    foreground: "#FFFFFF"
    title: "Notas"
    left:
      - text: "Início"
        href: https://raphateixeira.github.io/index.html
      - text: "Notas"
        href: index.qmd
      - text: "Livros"
        menu:
          - text: "Chan — Introduction to Probability for Data Science"
            href: chan-probabilidade/index.qmd
          - text: "Brunton — Optimization"
            href: brunton-otimizacao/index.qmd
          - text: "Brunton & Kutz — Data-Driven Science and Engineering"
            href: brunton-kutz-data-driven/index.qmd
          - text: "Bishop — Deep Learning: Foundations and Concepts"
            href: bishop-deep-learning/index.qmd
          - text: "Strang — Linear Algebra and Learning from Data"
            href: strang-linear-algebra/index.qmd
          - text: "Ventura Araújo — Differential Geometry"
            href: ventura-geometria-diferencial/index.qmd
          - text: "Larson — Multivariable Calculus"
            href: larson-calculo-multivariavel/index.qmd
          - text: "Komurcugil et al. — Advanced Control of Power Converters"
            href: hasan-advanced-control-power-converters/index.qmd
  page-footer:
    border: false
    center: "©2026 Prof. Dr. Raphael Teixeira — UFPA-CAMTUC-FEE"

format:
  html:
    theme: [cosmo, TemaRTx.scss]
    toc: true
    toc-depth: 3
    code-fold: false
    code-copy: true
    code-tools: true
    fig-align: center
    lang: pt-BR
