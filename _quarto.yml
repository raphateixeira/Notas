# ---------------------------------------------------------------------
#  Configuração do projeto Quarto — Notas de fundamentação teórica.
#  Hub que aponta para o repositório de cada tema de estudo (ver
#  index.qmd); notas avulsas que não pertencem a um tema consolidado
#  ficam em avulsas/.
# ---------------------------------------------------------------------

project:
  type: website
  output-dir: _site

execute:
  freeze: auto

bibliography: referencias.bib
csl: abnt.csl

website:
  title: "Notas"
  description: "Notas de fundamentação teórica por tema de estudo — Prof. Dr. Raphael Teixeira (UFPA-CAMTUC-FEE)"
  site-url: "https://raphateixeira.github.io/Notas/"
  reader-mode: true
  navbar:
    background: "#1F3A5F"
    foreground: "#FFFFFF"
    title: "Notas"
    left:
      - text: "Início"
        href: https://raphateixeira.github.io/index.html
      - text: "Fundamentos"
        href: index.qmd
      - text: "Avulsas"
        href: avulsas/index.qmd
  page-footer:
    border: false
    center: "©2026 Prof. Dr. Raphael Teixeira — UFPA-CAMTUC-FEE"

format:
  html:
    theme: [cosmo, TemaRTx.scss]
    toc: true
    toc-depth: 3
    code-fold: false
    code-copy: true
    code-tools: true
    fig-align: center
    lang: pt-BR
