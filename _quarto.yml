# ---------------------------------------------------------------------
#  Configuração do projeto Quarto — Notas de leitura.
#  Repositório único, organizado por pasta de livro; a separação lógica
#  é feita por "categories" no front matter e pelos listings abaixo.
# ---------------------------------------------------------------------

project:
  type: website
  output-dir: _site

execute:
  freeze: auto

bibliography: referencias.bib
csl: abnt.csl

website:
  title: "Notas"
  description: "Notas de leitura de livros-texto — Prof. Dr. Raphael Teixeira (UFPA-CAMTUC-FEE)"
  site-url: "https://raphateixeira.github.io/Notas/"
  reader-mode: true
  navbar:
    background: "#1F3A5F"
    foreground: "#FFFFFF"
    title: "Notas"
    left:
      - text: "Início"
        href: https://raphateixeira.github.io/index.html
      - text: "Notas"
        href: index.qmd
      - text: "Estante"
        href: estante.qmd
      - text: "Livros"
        menu:
          - text: "Chan — Introduction to Probability for Data Science"
            href: chan-probabilidade/index.qmd
          - text: "Brunton — Optimization"
            href: brunton-otimizacao/index.qmd
          - text: "Brunton & Kutz — Data-Driven Science and Engineering"
            href: brunton-kutz-data-driven/index.qmd
          - text: "Bishop — Deep Learning: Foundations and Concepts"
            href: bishop-deep-learning/index.qmd
  page-footer:
    border: false
    center: "©2026 Prof. Dr. Raphael Teixeira — UFPA-CAMTUC-FEE"

format:
  html:
    theme: [cosmo, TemaRTx.scss]
    toc: true
    toc-depth: 3
    code-fold: false
    code-copy: true
    code-tools: true
    fig-align: center
    lang: pt-BR
